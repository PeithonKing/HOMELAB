services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/metadata:/metadata
      - /mnt/ssd/media:/media
    restart: unless-stopped
    labels:
      glance.name: Jellyfin
      glance.icon: di:jellyfin
      glance.url: http://rpi.netbird.cloud:8096
      glance.description: Media streaming server
      glance.id: jellyfin
      glance.category: jellyfin

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
      - PORT=5055 #optional
    ports:
      - 8097:5055
    volumes:
      - ./jellyseerr/app/config:/app/config
      - /mnt/ssd/media:/media
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    depends_on:
      - jellyfin
    restart: unless-stopped
    labels:
      glance.name: Jellyfin Seer
      glance.icon: di:jellyseerr
      glance.url: http://rpi.netbird.cloud:8097
      glance.description: Jellyfin Seer for managing requests
      glance.id: jellyseerr
      glance.category: jellyfin

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr
    ports:
      - "8098:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./sonarr:/config
      - ./sonarr:/data
      - /mnt/ssd/media:/media
    restart: unless-stopped
    labels:
      # glance.parent: jellyseerr
      glance.name: Sonarr
      glance.icon: di:sonarr
      glance.url: http://rpi.netbird.cloud:8098
      glance.description: Managing TV series
      glance.id: sonarr
      glance.category: jellyfin

    
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr
    ports:
      - "8099:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./radarr:/config
      - ./radarr:/data
      - /mnt/ssd/media:/media
    restart: unless-stopped
    labels:
      # glance.parent: jellyseerr
      glance.name: Radarr
      glance.icon: di:radarr
      glance.url: http://rpi.netbird.cloud:8099
      glance.description: Managing movies
      glance.id: radarr
      glance.category: jellyfin

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    ports:
      - "8100:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./prowlarr:/config
      - /mnt/ssd/media:/media
    restart: unless-stopped
    labels:
      # glance.parent: jellyseerr
      glance.name: Prowlarr
      glance.icon: di:prowlarr
      glance.url: http://rpi.netbird.cloud:8100
      glance.description: Managing Torrents
      glance.id: prowlarr
      glance.category: jellyfin

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Kolkata
      WEBUI_PORT: 8080
      # DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/ssd/media:/media
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    labels:
      glance.name: qBittorrent
      glance.icon: di:qbittorrent
      glance.url: http://rpi.netbird.cloud:8080
      glance.description: Torrent client
      glance.id: qbittorrent
      glance.category: jellyfin
