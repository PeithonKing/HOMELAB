services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/metadata:/metadata
      - /mnt/ssd/media:/media
    restart: unless-stopped
    labels:
      glance.name: Jellyfin
      glance.icon: si:jellyfin
      glance.url: http://rpi.netbird.cloud:8096
      glance.description: Media streaming server
      glance.id: jellyfin
      glance.category: jellyfin

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
      - PORT=5055 #optional
    ports:
      - 8097:5055
    volumes:
      - ./jellyseerr/app/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    depends_on:
      - jellyfin
    restart: unless-stopped
    labels:
      glance.name: Jellyfin Seer
      glance.icon: sh:jellyseerr-light
      glance.url: http://rpi.netbird.cloud:8097
      glance.description: Jellyfin Seer for managing requests
      glance.id: jellyseerr
      glance.category: jellyfin

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr
    ports:
      - "8098:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./sonarr:/config
      - ./sonarr:/data
    labels:
      # glance.parent: jellyseerr
      glance.name: Sonarr
      glance.icon: sh:sonarr-light
      glance.url: http://rpi.netbird.cloud:8098
      glance.description: Sonarr for managing TV series
      glance.id: sonarr
      glance.category: jellyfin

    
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr
    ports:
      - "8099:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./radarr:/config
      - ./radarr:/data
    labels:
      # glance.parent: jellyseerr
      glance.name: Radarr
      glance.icon: sh:radarr-light
      glance.url: http://rpi.netbird.cloud:8099
      glance.description: Radarr for managing movies
      glance.id: radarr
      glance.category: jellyfin

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    ports:
      - "8100:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Kolkata
    volumes:
      - ./prowlarr:/config
    labels:
      # glance.parent: jellyseerr
      glance.name: Prowlarr
      glance.icon: sh:prowlarr-light
      glance.url: http://rpi.netbird.cloud:8100
      glance.description: Prowlarr for managing requests
      glance.id: prowlarr
      glance.category: jellyfin