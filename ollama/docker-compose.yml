services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - /mnt/ssd/ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    labels:
      glance.name: Ollama
      glance.icon: si:ollama
      glance.url: http://192.168.29.2:11434
      glance.description: Local LLM inference server
      glance.id: ollama
      glance.category: general
