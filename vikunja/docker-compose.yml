services:
  vikunja:
    image: vikunja/vikunja:2.7.0
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://192.168.29.4:3456/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    ports:
      - "3456:3456"
    volumes:
      - ./files:/app/vikunja/files
      - ./db:/db
    restart: unless-stopped
    labels:
      glance.name: Vikunja
      glance.icon: di:vikunja  # Using a generic to-do icon for Glance
      glance.url: http://192.168.29.4:3456
      glance.description: Task & Todo Management
      glance.id: vikunja
      glance.category: general
