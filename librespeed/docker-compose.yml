services:
  librespeed:
    image: ghcr.io/librespeed/speedtest
    container_name: librespeed
    restart: unless-stopped
    ports:
      - "5558:8080"
    environment:
      - MODE=standalone
    labels:
      glance.name: LibreSpeed
      glance.icon: si:speedtest
      glance.url: http://192.168.29.4:5558
      glance.description: Local Network Speed Test
      glance.id: librespeed
      glance.category: general
