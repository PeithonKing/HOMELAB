services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.8.6-omnibus
    container_name: scrutiny
    restart: unless-stopped
    privileged: true
    ports:
      - "8084:8080" # Web UI
    volumes:
      - ./scrutiny:/opt/scrutiny/config
      - ./influxdb2:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
      - /dev:/dev
    labels:
      glance.name: Scrutiny
      glance.icon: di:scrutiny
      glance.url: http://192.168.29.4:8084
      glance.description: Drive Health Monitor
      glance.id: scrutiny
      glance.category: general

