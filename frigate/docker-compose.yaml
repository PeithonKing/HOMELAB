services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    # Simple config for internal access
    command: mosquitto -c /mosquitto-no-auth.conf
    configs:
      - source: mosquitto_config
        target: /mosquitto-no-auth.conf
    labels:
      glance.parent: frigate
      glance.name: Mosquitto MQTT Broker
      glance.icon: si:mosquitto

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "128mb"
    devices:
      - /dev/dri/renderD128 # Pi 5 GPU
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /mnt/ssd/media/footage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
    depends_on:
      - mqtt
    labels:
      glance.name: Frigate
      glance.icon: si:frigate
      glance.url: http://192.168.29.2:5000
      glance.description: NVR with real-time object detection
      glance.id: frigate
      glance.category: general

configs:
  mosquitto_config:
    content: |
      listener 1883
      allow_anonymous true