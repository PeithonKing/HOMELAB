# include:
#   - compose.observability.yaml
services:
  speaches:
    extends:
      file: base-compose.yaml
      service: speaches
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    build:
      args:
        BASE_IMAGE: ubuntu:24.04
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    
    labels:
      glance.name: Speaches
      glance.url: http://192.168.29.2:8000
      glance.description: AI-powered speech recognition and synthesis
      glance.id: speaches
      glance.category: general
  
volumes:
  hf-hub-cache:
